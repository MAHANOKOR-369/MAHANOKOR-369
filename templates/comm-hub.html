<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAHANOKOR 369 | GLOBAL AI TV NODE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Kantumruy+Pro:wght@400;700&display=swap');

        :root {
            --bg-dark: #020617;
            --panel-bg: rgba(15, 23, 42, 0.9);
            --cyan: #00e5ff;
            --blue: #3b82f6;
            --red: #ef4444;
            --green: #22c55e;
            --yellow: #f59e0b;
            --text-main: #f8fafc;
            --border: #1e3a8a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Fira Code', 'Kantumruy Pro', monospace;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            background-image: radial-gradient(circle at center, #0a192f 0%, #020617 100%);
        }

        .comm-wrapper {
            width: 100%;
            max-width: 900px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.2);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sys-header {
            text-align: center;
            border-bottom: 1px dashed var(--cyan);
            padding-bottom: 8px;
        }
        .sys-header h1 { font-size: 1.1rem; color: var(--cyan); text-transform: uppercase; text-shadow: 0 0 10px var(--cyan); }
        .sys-header p { font-size: 0.7rem; color: var(--green); margin-top: 4px; }

        /* អេក្រង់ទូរទស្សន៍ AI កណ្តាល */
        .media-screen {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border: 1px solid var(--cyan);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 35px rgba(0,0,0,0.9);
        }

        #tv-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .screen-overlay-info {
            position: absolute;
            top: 8px;
            left: 8px;
            font-size: 0.7rem;
            color: var(--red);
            font-weight: bold;
            background: rgba(0,0,0,0.6);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--red);
        }

        .screen-channel-title {
            position: absolute;
            bottom: 8px;
            left: 8px;
            font-size: 0.75rem;
            color: var(--cyan);
            background: rgba(0,0,0,0.7);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        /* ប៊ូតុងប្តូរឆានែល */
        .channel-selector-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .chan-btn {
            background: #0b1120;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 4px;
            font-size: 0.7rem;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .chan-btn:hover, .chan-btn.active {
            background: var(--cyan);
            color: var(--bg-dark);
            border-color: var(--cyan);
            box-shadow: 0 0 10px var(--cyan);
            font-weight: bold;
        }

        .control-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
        }

        .action-group {
            background: #0b1120;
            border: 1px solid #1e293b;
            padding: 8px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .group-title {
            font-size: 0.65rem;
            color: #94a3b8;
            text-transform: uppercase;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 10px 8px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        button:hover { transform: translateY(-2px); }
        .btn-video { border-color: var(--blue); color: var(--blue); }
        .btn-video:hover { background: rgba(59, 130, 246, 0.2); }
        .btn-voice { border-color: var(--green); color: var(--green); }
        .btn-voice:hover { background: rgba(34, 197, 94, 0.2); }
        .btn-data { border-color: var(--cyan); color: var(--cyan); }
        .btn-data:hover { background: rgba(0, 229, 255, 0.2); }

        .sys-logs {
            height: 70px;
            background: #000;
            border: 1px solid #1e293b;
            border-radius: 6px;
            padding: 6px;
            font-size: 0.65rem;
            color: var(--green);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        input[type="file"] { display: none; }

        @media (max-width: 600px) {
            .channel-selector-grid { grid-template-columns: repeat(2, 1fr); }
            .control-panel { grid-template-columns: 1fr; }
            button { padding: 12px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <div class="comm-wrapper">
        <header class="sys-header">
            <h1>MAHANOKOR 369 | GLOBAL AI TV NODE</h1>
            <p id="net-status">STATUS: NATIONWIDE BROADCAST MATRIX CONNECTED</p>
        </header>

        <div class="media-screen">
            <div class="screen-overlay-info">● LIVE BROADCAST</div>
            <div class="screen-channel-title" id="chan-display">CH-01: GLOBAL AI SATELLITE FEED</div>
            <video id="tv-feed" autoplay muted loop playsinline src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"></video>
        </div>

        <div class="channel-selector-grid">
            <button class="chan-btn active" onclick="switchChannel(1, 'CH-01: GLOBAL AI SATELLITE', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4')">CH 01: 🌍 ពិភពលោក</button>
            <button class="chan-btn" onclick="switchChannel(2, 'CH-02: TOON MATRIX (តុក្កតា)', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4')">CH 02: 🧸 តុក្កតា</button>
            <button class="chan-btn" onclick="switchChannel(3, 'CH-03: NATIONWIDE NEWS', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4')">CH 03: 📡 ព័ត៌មាន</button>
            <button class="chan-btn" onclick="switchChannel(4, 'CH-04: SUPREME CCTV', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4')">CH 04: 📷 កាមេរ៉ា</button>
        </div>

        <div class="control-panel">
            <div class="action-group">
                <div class="group-title">Comm Control</div>
                <button class="btn-video" onclick="activateCamFeed()">📹 USER CAM</button>
                <button class="btn-voice" onclick="logEvent('Audio broadcast channel tuned.')">📞 AUDIO HUB</button>
            </div>

            <div class="action-group">
                <div class="group-title">Data Matrix</div>
                <button class="btn-data" onclick="document.getElementById('img-upload').click()">🖼️ SEND IMAGE</button>
                <input type="file" id="img-upload" accept="image/*" onchange="logEvent('Image uploaded to network.')">
                
                <button class="btn-data" onclick="document.getElementById('file-upload').click()">📁 SEND FILE</button>
                <input type="file" id="file-upload" onchange="logEvent('Data file uploaded.')">
            </div>
        </div>

        <div class="sys-logs" id="log-window">
            <span>[SYSTEM]: Global AI TV broadcast node online. All channels synchronized.</span>
        </div>
    </div>

    <script>
        const tvFeed = document.getElementById('tv-feed');

        function switchChannel(id, title, videoUrl) {
            document.querySelectorAll('.chan-btn').forEach((btn, index) => {
                if(index === (id - 1)) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            document.getElementById('chan-display').innerText = title;
            tvFeed.src = videoUrl;
            tvFeed.play();
            logEvent(`Switched to broadcast channel: ${title}`);
        }

        async function activateCamFeed() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                tvFeed.srcObject = stream;
                document.getElementById('chan-display').innerText = "CH-05: LOCAL USER CAMERA FEED";
                logEvent("User camera connected successfully to master display.");
            } catch (err) {
                logEvent("ERROR: Camera access restricted.");
            }
        }

        function logEvent(message) {
            const logWindow = document.getElementById('log-window');
            const time = new Date().toLocaleTimeString();
            const newLog = document.createElement('span');
            newLog.innerText = `[${time}] ${message}`;
            logWindow.appendChild(newLog);
            logWindow.scrollTop = logWindow.scrollHeight;
        }
    </script>
</body>
</html>
