<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHANOKOR 369 | COMMAND CENTER</title>
    
    <!-- Link Modular CSS (ស្រាល និងរហ័ស) -->
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/animations.css">
</head>
<body>

    <header class="glass-panel" style="display:flex; justify-content:space-between; align-items:center;">
        <div>
            <h2 class="glow-text">👑 MAHANOKOR 369</h2>
            <small style="color:var(--neon-blue);">SUPREME REALM EXPRESS (PHASE 1 - 30)</small>
        </div>
        <div style="border: 1px solid var(--neon-gold); padding: 5px 15px; border-radius: 4px;">
            <span class="glow-text">COMMANDER: KHOEM SOKSIVUTHA</span>
        </div>
    </header>

    <div class="grid-matrix">
        
        <div class="glass-panel radar-scan">
            <h3 style="color:var(--neon-blue);">🛡️ CORE SYSTEM <span class="status-dot"></span></h3>
            <p id="sys-status" style="font-size:20px; font-weight:bold; color:var(--neon-green);">INITIALIZING...</p>
            <input type="password" id="masterKeyInput" placeholder="Enter Master Key" style="width:90%; padding:10px; background:#000; border:1px solid var(--neon-blue); color:white; margin-bottom:10px;">
            <button class="btn-command" onclick="executeOverride()">AUTHORIZE COMMAND</button>
        </div>

        <div class="glass-panel">
            <h3 style="color:var(--neon-gold);">🛰️ GPS MATRIX <span class="status-dot"></span></h3>
            <p id="gps-data" style="font-family:monospace; margin-top:20px;">Tracking Assets...</p>
        </div>

        <div class="glass-panel" style="grid-column: 1 / -1;">
            <h3 style="color:var(--text-main);">💻 EMPIRE TERMINAL LOGS</h3>
            <div id="terminal-logs" style="height: 150px; overflow-y: auto; font-family: monospace; font-size: 14px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 4px; border: 1px solid #333;">
                <span style="color:var(--neon-blue)">[SYSTEM]</span> Mahanokor 369 Core Initiated. Ready for commands.
            </div>
        </div>

    </div>

    <!-- Link Modular JS (នៅខាងក្រោមដើម្បីកុំឱ្យទាក់ការ Load ក្រាហ្វិក) -->
    <script src="/static/js/api_handler.js"></script>
    <script src="/static/js/ui_controller.js"></script>

</body>
</html>
